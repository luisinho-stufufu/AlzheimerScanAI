<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Distribución de sujetos por CDR en OASIS-1</title>
  <desc id="desc">Gráfico de barras para 416 sujetos únicos: CDR 0, 135; CDR 0.5, 70; CDR 1, 28; CDR 2, 2; sin CDR, 181.</desc>
  <rect width="1000" height="650" fill="#ffffff"/>
  <text x="500" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172b4d">Distribución de sujetos por CDR</text>
  <text x="500" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#526276">OASIS-1 · 416 sujetos únicos (sesión base MR1) · 235 con CDR registrado</text>

  <line x1="130" y1="500" x2="900" y2="500" stroke="#455468" stroke-width="2"/>
  <line x1="130" y1="130" x2="130" y2="500" stroke="#455468" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="14" fill="#526276" text-anchor="end">
    <text x="115" y="505">0</text>
    <text x="115" y="413">50</text>
    <text x="115" y="320">100</text>
    <text x="115" y="228">150</text>
    <text x="115" y="135">200</text>
  </g>
  <g stroke="#dce3eb" stroke-width="1">
    <line x1="130" y1="407.5" x2="900" y2="407.5"/>
    <line x1="130" y1="315" x2="900" y2="315"/>
    <line x1="130" y1="222.5" x2="900" y2="222.5"/>
    <line x1="130" y1="130" x2="900" y2="130"/>
  </g>
  <text x="35" y="315" transform="rotate(-90 35 315)" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#34445a">Número de sujetos</text>

  <g>
    <rect x="190" y="250.25" width="95" height="249.75" rx="5" fill="#277da1"/>
    <rect x="340" y="370.5" width="95" height="129.5" rx="5" fill="#f9c74f"/>
    <rect x="490" y="448.2" width="95" height="51.8" rx="5" fill="#f9844a"/>
    <rect x="640" y="496.3" width="95" height="3.7" rx="2" fill="#d1495b"/>
    <rect x="790" y="165.15" width="95" height="334.85" rx="5" fill="#a8b0bb"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#172b4d">
    <text x="237.5" y="238">135</text>
    <text x="387.5" y="358">70</text>
    <text x="537.5" y="436">28</text>
    <text x="687.5" y="481">2</text>
    <text x="837.5" y="153">181</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#34445a">
    <text x="237.5" y="529">CDR = 0</text>
    <text x="387.5" y="529">CDR = 0.5</text>
    <text x="537.5" y="529">CDR = 1</text>
    <text x="687.5" y="529">CDR = 2</text>
    <text x="837.5" y="529">Sin CDR</text>
  </g>
  <text x="500" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#526276">La categoría «Sin CDR» indica etiqueta ausente; no constituye una clase ni implica CDR = 0.</text>
  <text x="500" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#526276">Entre los sujetos con CDR registrado no hay observaciones con CDR = 3.</text>
</svg>
